[project]
name = "thesis"
version = "0.1.0"
description = ""
authors = [
    {name = "Kai Erik Niermann",email = "kai.niermann@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "julia (>=0.6.2,<0.7.0)",
    "juliacall (>=0.9.24,<0.10.0)",
    "cuda-python (>=12.8.0,<13.0.0)",
    "numba (>=0.61.0,<0.62.0)",
    "numpy (==2.1)",
    "pillow (>=11.1.0,<12.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "scipy (>=1.15.1,<2.0.0)",
    "flameprof (>=0.4,<0.5)",
    "pyright (>=1.1.393,<2.0.0)",
    "gprof2dot (>=2024.6.6,<2025.0.0)",
    "networkx (>=3.5,<4.0)",
    "statsmodels (>=0.14.4,<0.15.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"

[tool.pyright]
strict = ["strict"]
stubPath = "./typings"